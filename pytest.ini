[pytest]
testpaths = tests
norecursedirs = .git .venv venv build docs reports
addopts =
    -v
    --strict-markers
    --tb=short
    -p no:warnings
    --alluredir=reports/allure-results
    --clean-alluredir

markers =
    smoke: Fast, high-value subset that gates every commit and deployment.
    regression: Full validation matrix (boundaries, negatives, protocol, auth).
    api: Exercises the backend directly through the HTTP API.
    ui: Exercises the browser through Selenium WebDriver.
    e2e: End-to-end user journey spanning UI and backend.
    boundary: Boundary-value analysis around a documented business rule.
    negative: Invalid input / error-path validation.
    security: Auth, injection-shaped payloads and protocol abuse.
    spec_gap: Encodes an expectation the specification leaves ambiguous. See docs/03_strategy_and_recommendations.md.
    concurrency: Requires two competing requests for the same user.
    slow: Noticeably slower than the rest of the suite.

log_cli = false
