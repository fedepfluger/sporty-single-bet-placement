name: tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly full regression against the deployed environment.
    - cron: "0 3 * * *"

concurrency:
  # The suite mutates one shared balance per user id, so runs must not overlap.
  group: single-bet-suite-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: cp .env.example .env
      - run: pre-commit run --all-files

  test:
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        suite: [smoke, regression]
    env:
      # Never inline a credential here. These come from the repository secrets.
      USER_ID: ${{ secrets.USER_ID }}
      BASE_URL: ${{ vars.BASE_URL }}
      API_BASE_URL: ${{ vars.API_BASE_URL }}
      HEADLESS: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable
      - run: pip install -r requirements.txt
      # `.env.example` carries every non-secret required value. The secrets and
      # any repository variable set above win over it; an empty one does not.
      - run: cp .env.example .env
      # The nightly job runs everything; pull requests only pay for the smoke gate.
      - name: Run the ${{ matrix.suite }} suite
        if: matrix.suite == 'smoke' || github.event_name == 'schedule'
        run: pytest -m ${{ matrix.suite }} --reruns 1 --reruns-delay 2

      - name: Generate the Allure single-file report
        if: always() && (matrix.suite == 'smoke' || github.event_name == 'schedule')
        run: |
          npm install -g allure-commandline@2.43.0
          allure generate reports/allure-results --single-file -o reports/allure-report --clean

      - name: Publish the Allure report
        if: always() && (matrix.suite == 'smoke' || github.event_name == 'schedule')
        uses: actions/upload-artifact@v7
        with:
          name: allure-report-${{ matrix.suite }}
          path: reports/allure-report/index.html
          retention-days: 14
